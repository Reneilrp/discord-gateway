# ==============================================================================
# Linux Kernel Sysctl Optimization for WireGuard Gateway
# Copy this file to: /etc/sysctl.d/99-wireguard.conf
# Apply with: sudo sysctl --system
# ==============================================================================

# Enable IPv4 packet forwarding between interfaces (Required for WireGuard VPN)
net.ipv4.ip_forward = 1
net.ipv4.conf.all.forwarding = 1
net.ipv4.conf.default.forwarding = 1

# Required for WireGuard policy routing / firewall marks (prevent martian drops)
net.ipv4.conf.all.src_valid_mark = 1
net.ipv4.conf.default.src_valid_mark = 1

# Enable IPv6 packet forwarding (Uncomment if using IPv6 WireGuard / Discord)
net.ipv6.conf.all.forwarding = 1
net.ipv6.conf.default.forwarding = 1

# TCP BBR Congestion Control & FQ queue discipline (Improves voice/video throughput & latency)
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Maximize UDP socket receive and send buffer memory for high Discord voice/video traffic
net.core.rmem_max = 26214400
net.core.wmem_max = 26214400
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576

# Network device backlog for packet bursts
net.core.netdev_max_backlog = 5000
